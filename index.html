<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>車輛檢測與零件透視系統 - Visual Inspection Hub</title>
  <!-- SheetJS 解析庫 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f141c;
      --panel-bg: rgba(22, 30, 44, 0.95);
      --border-color: #2a3b53;
      --accent-cyan: #00d2ff;
      --accent-green: #00e676;
      --accent-orange: #ff9100;
      --accent-red: #ff3d00;
      --text-main: #f0f4f8;
      --text-muted: #8a9ba8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

    /* Header */
    header { background: #141c28; border-bottom: 1px solid var(--border-color); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; flex-wrap: wrap; gap: 8px; }
    .nav-selectors { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn-group { display: inline-flex; gap: 4px; align-items: center; }
    select, input, button { background: #1a2332; border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 10px; border-radius: 4px; font-size: 13px; outline: none; }
    select:focus, input:focus { border-color: var(--accent-cyan); }
    button { cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    button:hover { background: #26354a; border-color: var(--accent-cyan); }
    button.primary { background: #006699; border-color: var(--accent-cyan); }
    button.primary:hover { background: #0088cc; }
    button.danger { background: #5a1a1a; border-color: var(--accent-red); }
    button.danger:hover { background: #7a2424; }

    /* 快速複製按鈕 */
    .btn-copy-info { background: #102a3a; border: 1px solid var(--accent-cyan); color: var(--accent-cyan); font-weight: bold; padding: 6px 12px; border-radius: 4px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
    .btn-copy-info:hover { background: var(--accent-cyan); color: #000; }

    /* Workspace */
    .workspace { display: flex; flex: 1; height: calc(100vh - 90px); position: relative; overflow: hidden; }
    .viewport { flex: 1; position: relative; background: #080b10; overflow: auto; display: flex; align-items: center; justify-content: center; user-select: none; }
    .image-container { position: relative; display: inline-block; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
    .base-img { max-width: 100%; max-height: calc(100vh - 140px); display: block; object-fit: contain; }

    .image-container.adding-mode { cursor: crosshair !important; }
    .image-container.adding-mode .base-img { cursor: crosshair !important; }

    /* 畫布懸浮操作列 */
    .canvas-toolbar { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; z-index: 20; background: rgba(15, 23, 36, 0.9); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); backdrop-filter: blur(8px); flex-wrap: wrap; }
    .mode-btn { display: inline-flex; align-items: center; gap: 6px; font-weight: bold; padding: 6px 12px; border-radius: 4px; }
    .mode-btn.active { background: #0077aa; border-color: var(--accent-cyan); color: #fff; box-shadow: 0 0 10px rgba(0,210,255,0.5); }

    /* Hotspots */
    .hotspot { position: absolute; width: 32px; height: 32px; transform: translate(-50%, -50%); border-radius: 50%; cursor: pointer; z-index: 5; transition: transform 0.2s; touch-action: manipulation; }
    .hotspot::before { content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%; background: var(--accent-cyan); opacity: 0.85; }
    .hotspot::after { content: ''; position: absolute; top: -6px; left: -6px; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent-cyan); animation: pulse 2s infinite; }
    .hotspot.status-red::before { background: var(--accent-red); }
    .hotspot.status-red::after { border-color: var(--accent-red); }
    .hotspot.status-green::before { background: var(--accent-green); }
    .hotspot.status-green::after { border-color: var(--accent-green); }
    .hotspot.status-yellow::before { background: var(--accent-orange); }
    .hotspot.status-yellow::after { border-color: var(--accent-orange); }
    .hotspot:hover { transform: translate(-50%, -50%) scale(1.25); z-index: 10; }
    @keyframes pulse { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }

    /* Sidebar Editor */
    .sidebar { width: 440px; background: var(--panel-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 15; backdrop-filter: blur(10px); }
    .sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-content { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: var(--text-muted); font-weight: bold; }
    
    /* 縮圖展示與檔名標註 */
    .photo-preview-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 6px; }
    .thumb-card { display: flex; flex-direction: column; background: #121924; border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; }
    .thumb-wrap { position: relative; width: 100%; height: 110px; cursor: pointer; background: #000; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-filename { font-size: 11px; color: var(--accent-cyan); padding: 4px 6px; font-family: monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: #0c121c; border-top: 1px solid var(--border-color); }

    .thumb-btn-group { position: absolute; top: 4px; right: 4px; display: flex; gap: 4px; z-index: 3; }
    .thumb-btn { background: rgba(15, 23, 36, 0.85); color: #fff; border: 1px solid var(--border-color); border-radius: 4px; width: 24px; height: 24px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); transition: all 0.2s; }
    .thumb-btn:hover { background: var(--accent-cyan); color: #000; }
    .thumb-btn.del:hover { background: var(--accent-red); color: #fff; }

    /* 外連排版 */
    .ext-link-card { background: #121924; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .ext-link-card .ext-label { font-size: 12px; color: #a0b3c6; font-weight: bold; }
    .ext-link-row { display: flex; gap: 6px; }
    .ext-link-row input { flex: 1; }
    .ext-test-btn { background: #1e2c3f; border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }

    /* Hover Inspection Card */
    .hover-card { position: absolute; background: rgba(13, 20, 32, 0.98); border: 1.5px solid var(--accent-cyan); border-radius: 12px; padding: 16px; width: 480px; pointer-events: auto; z-index: 50; display: none; backdrop-filter: blur(14px); box-shadow: 0 20px 45px rgba(0,0,0,0.8); }
    .hover-slider-wrap { position: relative; width: 100%; height: 280px; border-radius: 8px; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--border-color); background: #000; }
    .hover-slider-wrap img { width: 100%; height: 100%; object-fit: contain; cursor: pointer; }
    .slider-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.65); color: #fff; border: none; font-size: 18px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 3; }
    .slider-nav-btn.prev { left: 8px; }
    .slider-nav-btn.next { right: 8px; }
    .slider-counter { position: absolute; bottom: 8px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; z-index: 3; }
    .slider-filename-tag { position: absolute; top: 8px; left: 10px; background: rgba(0,0,0,0.75); color: var(--accent-cyan); font-family: monospace; font-size: 11px; padding: 2px 8px; border-radius: 4px; z-index: 3; border: 1px solid rgba(0,210,255,0.3); }

    .hover-card .stock-tag { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #004d40; color: #a7ffeb; margin-bottom: 8px; }
    .hover-card .stock-tag.out { background: #5a1a1a; color: #ff8a80; }
    .hover-card .category-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-left: 6px; margin-bottom: 8px; }
    .category-badge.badge-red { background: rgba(255, 61, 0, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .category-badge.badge-green { background: rgba(0, 230, 118, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .category-badge.badge-yellow { background: rgba(255, 145, 0, 0.2); color: var(--accent-orange); border: 1px solid var(--accent-orange); }

    .hover-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
    .hover-row .label { color: var(--text-muted); }

    .card-links-group { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); flex-wrap: wrap; }
    .card-ext-btn { display: inline-flex; align-items: center; gap: 4px; background: #162438; border: 1px solid var(--accent-cyan); color: var(--accent-cyan); text-decoration: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .card-close-btn { display: none; position: absolute; top: 12px; right: 14px; font-size: 22px; color: #fff; background: transparent; border: none; cursor: pointer; }

    /* Tabs */
    .view-tabs { display: flex; gap: 6px; padding: 8px 16px; background: #0c1017; border-bottom: 1px solid var(--border-color); align-items: center; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
    .tab { padding: 6px 14px; border-radius: 4px; background: #141c28; border: 1px solid var(--border-color); font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .tab.active { background: #004466; border-color: var(--accent-cyan); color: #fff; font-weight: bold; }
    .tab-del-btn { color: #ff8a80; cursor: pointer; font-size: 12px; border-radius: 50%; padding: 0 4px; }

    /* Lightbox Modal */
    .lightbox-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.95); z-index: 999; justify-content: center; align-items: center; }
    .lightbox-modal img { max-width: 96vw; max-height: 88vh; border-radius: 8px; box-shadow: 0 0 45px rgba(0,210,255,0.4); object-fit: contain; }
    .lightbox-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(20,30,45,0.85); color: #fff; border: 1px solid var(--border-color); font-size: 24px; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .lightbox-btn.prev { left: 16px; }
    .lightbox-btn.next { right: 16px; }
    .lightbox-close { position: absolute; top: 16px; right: 20px; font-size: 30px; color: #fff; cursor: pointer; background: transparent; border: none; z-index: 1000; }
    .lightbox-header-tag { position: absolute; top: 20px; left: 24px; font-family: monospace; font-size: 14px; background: rgba(0,0,0,0.8); color: var(--accent-cyan); padding: 4px 14px; border-radius: 6px; border: 1px solid var(--border-color); }
    .lightbox-counter { position: absolute; bottom: 20px; font-size: 13px; background: rgba(0,0,0,0.7); color: #00d2ff; padding: 4px 12px; border-radius: 20px; }

    /* RWD 手機版 */
    @media (max-width: 768px) {
      .desktop-admin-only,
      .btn-group,
      .canvas-toolbar,
      .sidebar,
      .tab-del-btn,
      #noImagePrompt button {
        display: none !important;
      }

      header { padding: 8px 12px; justify-content: flex-start; gap: 10px; background: #0f141c; }
      .nav-selectors { width: 100%; display: flex; justify-content: space-between; }
      .nav-selectors select { font-size: 14px; padding: 8px 12px; flex: 1; font-weight: bold; background: #162232; }

      .view-tabs { padding: 6px 12px; background: #0a0d14; }
      .tab { font-size: 13px; padding: 6px 12px; }

      .workspace { height: calc(100vh - 100px); height: calc(100dvh - 100px); }
      .base-img { max-height: calc(100vh - 130px); max-height: calc(100dvh - 130px); }

      .hover-card { 
        position: fixed; 
        bottom: 0; 
        left: 0; 
        width: 100% !important; 
        max-height: 82vh; 
        overflow-y: auto; 
        border-radius: 20px 20px 0 0; 
        border: none;
        border-top: 2px solid var(--accent-cyan); 
        box-shadow: 0 -15px 40px rgba(0,0,0,0.9);
        top: auto !important; 
        transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        display: block !important;
        visibility: hidden;
      }
      .hover-card.mobile-active {
        visibility: visible;
        transform: translateY(0);
      }
      .card-close-btn { display: block; }
      .hover-slider-wrap { height: 230px; }
      .card-links-group .card-ext-btn { flex: 1; justify-content: center; padding: 8px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-selectors">
      <select id="brandSelect" onchange="switchBrand()"></select>
      <div class="btn-group desktop-admin-only">
        <button onclick="renameBrand()">✏️ 改名</button>
        <button onclick="addBrand()">➕ 廠牌</button>
        <button class="danger" onclick="deleteBrand()">🗑️</button>
      </div>
      
      <select id="modelSelect" onchange="switchModel()"></select>
      <div class="btn-group desktop-admin-only">
        <button onclick="renameModel()">✏️ 改名</button>
        <button onclick="addModel()">➕ 車型</button>
        <button class="danger" onclick="deleteModel()">🗑️</button>
      </div>
    </div>

    <div class="desktop-admin-only" style="display:flex; align-items:center; gap:6px;">
      <span id="syncStatus" style="font-size: 12px; color: var(--accent-cyan); font-weight:bold;">● 讀取中...</span>
      <button class="primary" onclick="syncCloudNow()">🔄 立即同步雲端</button>
      <button onclick="document.getElementById('inventoryFileInput').click()">📂 載入本機表</button>
      <input type="file" id="inventoryFileInput" accept=".xlsx, .xls, .csv" style="display:none" onchange="loadLocalInventoryFile(event)">
      <button onclick="exportData()">💾 匯出 (data01.json)</button>
      <button onclick="document.getElementById('importFile').click()">📂 匯入</button>
      <input type="file" id="importFile" style="display:none" onchange="importData(event)">
      <button class="danger" onclick="clearAllData()" style="font-size:12px;">🗑️ 重置</button>
    </div>
  </header>

  <div class="view-tabs" id="viewTabsContainer"></div>

  <div class="workspace">
    <div class="viewport" id="viewport">
      
      <div class="canvas-toolbar desktop-admin-only" id="canvasToolbar" style="display:none;">
        <button id="addHotspotModeBtn" class="mode-btn" onclick="toggleAddHotspotMode()">📍 新增熱點標記 (點擊啟用)</button>
        <button onclick="document.getElementById('baseImgInput').click()">🔄 更換底圖</button>
        <button class="danger" onclick="deleteBaseImage()">🗑️ 刪除底圖</button>
      </div>

      <div class="image-container" id="imageContainer">
        <img id="baseImage" class="base-img" src="" alt="請上傳底圖" style="display:none;">
        <div id="noImagePrompt" style="padding: 40px; border: 2px dashed var(--border-color); text-align: center; border-radius: 8px;">
          <p style="margin-bottom: 12px; color: var(--text-muted); font-size: 14px;">尚未上傳此部位底圖</p>
          <button class="primary desktop-admin-only" onclick="document.getElementById('baseImgInput').click()">上傳部位底圖</button>
        </div>
      </div>
      <input type="file" id="baseImgInput" accept="image/*" style="display:none" onchange="uploadBaseImage(event)">
    </div>

    <!-- 零件資訊卡 -->
    <div class="hover-card" id="hoverCard" onmouseenter="cancelCardHide()" onmouseleave="hideHoverCard()">
      <button class="card-close-btn" onclick="hideHoverCard(true)">✕</button>
      <div class="hover-slider-wrap" id="hoverSliderWrap" style="display:none;">
        <div class="slider-filename-tag" id="cardPhotoFileName">--</div>
        <img id="cardImg" src="" onclick="openLightboxFromCard()">
        <button class="slider-nav-btn prev" onclick="prevCardPhoto(event)">◀</button>
        <button class="slider-nav-btn next" onclick="nextCardPhoto(event)">▶</button>
        <div class="slider-counter" id="cardPhotoCounter">1 / 1</div>
      </div>
      
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div>
          <div id="cardStockTag" class="stock-tag">庫存充足</div>
          <div id="cardCategoryBadge" class="category-badge badge-red">銷售估價</div>
        </div>
        <button class="btn-copy-info" onclick="copyPurePartInfo()">📋 複製報價訊息</button>
      </div>

      <h3 id="cardPartName" style="margin-bottom: 6px; color: var(--accent-cyan); font-size: 18px;">零件名稱</h3>
      <div class="hover-row"><span class="label">零件料號:</span><span id="cardPartNo" style="font-family: monospace; font-size:15px; font-weight:bold;">--</span></div>
      <div class="hover-row"><span class="label">層架儲位:</span><span id="cardRack" style="color:#ffd54f; font-weight:bold; font-size:15px;">--</span></div>
      <div class="hover-row"><span class="label">在庫數量:</span><span id="cardQty" style="font-weight:bold; font-size:15px;">--</span></div>
      <div class="hover-row"><span class="label">建議售價:</span><span id="cardPrice" style="color:#81c784; font-weight:bold; font-size:15px;">--</span></div>
      <p id="cardNotes" style="font-size: 13px; color: var(--text-muted); margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 8px; line-height: 1.4;"></p>
      
      <div class="card-links-group" id="cardLinksGroup" style="display:none;">
        <a id="cardExtBtn1" class="card-ext-btn" target="_blank" style="display:none;">🎥 診斷/拆裝影片</a>
        <a id="cardExtBtn2" class="card-ext-btn" target="_blank" style="display:none;">📄 手冊/電路圖 PDF</a>
        <a id="cardExtBtn3" class="card-ext-btn" target="_blank" style="display:none;">🌐 零件規格資訊</a>
      </div>
    </div>

    <!-- Sidebar Editor -->
    <div class="sidebar desktop-admin-only" id="sidebar">
      <div class="sidebar-header">
        <span id="editorTitle">零件熱點編輯</span>
        <div style="display:flex; gap:6px;">
          <button class="btn-copy-info" onclick="copyPurePartInfo()" style="font-size:12px; padding:4px 8px;">📋 複製訊息</button>
          <button class="danger" id="deleteHotspotBtn" onclick="deleteCurrentHotspot()" style="display:none;">刪除熱點</button>
          <button onclick="deselectHotspot()" style="display:none;" id="sidebarCloseBtn">✕ 關閉</button>
        </div>
      </div>
      <div class="sidebar-content" id="editorForm" style="display:none;">
        <div class="form-group">
          <label>維修與銷售屬性</label>
          <select id="inputStatus" onchange="updateHotspotVisual()">
            <option value="status-red">🔴 銷售估價 (損壞更換 / 主動報價)</option>
            <option value="status-green">🟢 定期更換 (例行保養 / 固定更換)</option>
            <option value="status-yellow">🟡 預防性更換 (老化預警 / 提早更換)</option>
          </select>
        </div>
        <div class="form-group">
          <label>綁定零件代號 (輸入即自動比對)</label>
          <input type="text" id="inputPartNo" placeholder="如: 1611909180" oninput="matchInventory()" style="font-family:monospace; font-size:15px; font-weight:bold;">
        </div>
        <div class="form-group">
          <label>零件名稱 (自動抓取 / 可自訂)</label>
          <input type="text" id="inputPartName" placeholder="如: 雨刷清潔液（1Ｌ）">
        </div>
        <div class="form-group">
          <label>即時庫存資訊</label>
          <div style="background:#101722; padding:10px; border-radius:6px; font-size:13px; border:1px solid var(--border-color); display:flex; flex-direction:column; gap:6px;">
            <div style="display:flex; justify-content:space-between;"><span>層架儲位:</span><b id="dispRack" style="color:#ffd54f; font-size:15px;">--</b></div>
            <div style="display:flex; justify-content:space-between;"><span>目前在庫:</span><b id="dispQty" style="font-size:15px;">--</b></div>
            <div style="display:flex; justify-content:space-between;"><span>建議訂價:</span><b id="dispPrice" style="color:#81c784; font-size:15px;">--</b></div>
          </div>
        </div>
        <div class="form-group">
          <label>技師檢測備註</label>
          <textarea id="inputNotes" rows="3" style="background:#1a2332; border:1px solid var(--border-color); color:#fff; border-radius:4px; padding:8px; font-size:13px;"></textarea>
        </div>
        <div class="form-group">
          <label>特寫細節照片 (縮圖下方標註原始檔名)</label>
          <button onclick="document.getElementById('photoInput').click()">➕ 新增特寫照片</button>
          <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="uploadDetailPhotos(event)">
          <input type="file" id="replacePhotoInput" accept="image/*" style="display:none" onchange="executePhotoReplace(event)">
          <div class="photo-preview-grid" id="photoGrid"></div>
        </div>

        <div class="form-group" style="border-top: 1px solid var(--border-color); padding-top: 10px; display: flex; flex-direction: column; gap: 8px;">

    const DB_NAME = "AutoInspectionDB_v2";

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('store')) d.createObjectStore('store');
        };
        req.onsuccess = () => { db = req.result; resolve(db); };
        req.onerror = () => reject(req.error);
      });
    }

    function dbSet(key, val) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('store', 'readwrite');
        tx.objectStore('store').put(val, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function dbGet(key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('store', 'readonly');
        const req = tx.objectStore('store').get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function parseCSV(text) {
      const p = [];
      let row = [''];
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i+1];
        if (c === '"') {
          if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
          else { inQuotes = !inQuotes; }
        } else if (c === ',' && !inQuotes) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') { i++; }
          p.push(row);
          row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') p.push(row);
      return p;
    }

    // 第一優先：直接讀取 Google 雲端 CSV (永遠確保最新報價)
    async function autoFetchCloudCSV() {
      const statusEl = document.getElementById('syncStatus');
      try {
        if (statusEl) statusEl.innerText = "● 正在同步雲端報價...";
        
        let text = "";
        try {
          const res = await fetch(CSV_URL);
          if (!res.ok) throw new Error("Fetch failed");
          text = await res.text();
        } catch (e) {
          const proxyRes = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(CSV_URL));
          text = await proxyRes.text();
        }

        const rows = parseCSV(text);
        let headerRow = 17;
        for (let i = 0; i < Math.min(25, rows.length); i++) {
          if (rows[i].some(col => (col || '').includes('零件代號'))) {
            headerRow = i;
            break;
          }
        }

        inventoryDB = {};
        for (let i = headerRow + 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 7) continue;
          const rawPartNo = (row[3] || '').trim();
          if (!rawPartNo) continue;

          const item = {
            rawPartNo: rawPartNo,
            name: (row[4] || '').trim(),
            spec: (row[5] || '').trim(),
            rack: (row[6] || '').trim() || '未設定',
            qty: parseInt(row[9]) || 0,
            price: (row[22] || '0').trim()
          };
          const cleanKey = rawPartNo.replace(/^0+/, '');
          inventoryDB[rawPartNo] = item;
          inventoryDB[cleanKey] = item;
        }

        await dbSet('inventory_db', inventoryDB);
        const count = getUniqueInventoryCount();
        if (statusEl) {
          statusEl.innerText = `● 雲端報價同步完成 (${count} 筆)`;
          statusEl.style.color = "var(--accent-green)";
        }
        if (selectedHotspot) matchInventory();
        return true;
      } catch (err) {
        return false;
      }
    }

    // 第二優先備援：讀取同目錄 data02.xlsx
    async function autoFetchLocalExcel() {

        const data = new Uint8Array(arrayBuf);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

        let headerRow = 17;
        for (let i = 0; i < Math.min(25, rows.length); i++) {
          if (rows[i] && rows[i].some(col => String(col).includes('零件代號'))) {
            headerRow = i;
            break;
          }
        }

        inventoryDB = {};
        for (let i = headerRow + 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 7) continue;
          const rawPartNo = String(row[3] || '').trim();
          if (!rawPartNo) continue;

          const item = {
            rawPartNo: rawPartNo,
            name: String(row[4] || '').trim(),
            spec: String(row[5] || '').trim(),
            rack: String(row[6] || '').trim() || '未設定',
            qty: parseInt(row[9]) || 0,
            price: String(row[22] || '0').trim()
          };
          const cleanKey = rawPartNo.replace(/^0+/, '');
          inventoryDB[rawPartNo] = item;
          inventoryDB[cleanKey] = item;
        }

        await dbSet('inventory_db', inventoryDB);
        const count = getUniqueInventoryCount();
        const statusEl = document.getElementById('syncStatus');
        if (statusEl) {
          statusEl.innerText = `● data02.xlsx 連線 (${count} 筆)`;

      } catch (err) {
        return false;
      }
    }

    function loadLocalInventoryFile(e) {

      const reader = new FileReader();

      statusEl.innerText = `● 正在解析 ${file.name}...`;

      reader.onload = async function(evt) {

          const worksheet = workbook.Sheets[firstSheetName];

              break;
            }
          }

          inventoryDB = {};

            const row = rows[i];

            const rawPartNo = String(row[3] || '').trim();
            if (!rawPartNo) continue;

            const item = {
              rawPartNo: rawPartNo,

              spec: String(row[5] || '').trim(),
              rack: String(row[6] || '').trim() || '未設定',

            };

            const cleanKey = rawPartNo.replace(/^0+/, '');

          statusEl.style.color = "var(--accent-red)";
        }

      reader.readAsArrayBuffer(file);
    }

    async function init() {
      await openDB();
      const statusEl = document.getElementById('syncStatus');

      // 1. 底圖與熱點資料載入 (優先讀取 data01.json)
      let loadedFromServer = false;
      try {
        const res = await fetch(DATA_JSON_FILE);
        if (res.ok) {
          const serverData = await res.json();
          if (serverData && serverData.brands) {
            appData = serverData;
            await autoSave();
            loadedFromServer = true;
          }
        }
      } catch (e) {}

      if (!loadedFromServer) {
        const savedApp = await dbGet('app_data');
        if (savedApp && savedApp.brands && savedApp.brands.length >= 4) {
          appData = savedApp;
        } else {
          appData = JSON.parse(JSON.stringify(defaultAppData));
          await autoSave();
        }
      }

      // 2. 報價庫存載入：永遠第一優先讀取 Google 雲端 CSV
      const cloudLoaded = await autoFetchCloudCSV();
      if (!cloudLoaded) {
        // 斷網備援 1：讀取本地 data02.xlsx
        const excelLoaded = await autoFetchLocalExcel();
        if (!excelLoaded) {
          // 斷網備援 2：讀取瀏覽器上次記憶庫
          const savedInv = await dbGet('inventory_db');
          if (savedInv && Object.keys(savedInv).length > 0) {
            inventoryDB = savedInv;
            if (statusEl) {
              statusEl.innerText = `● 離線快取已就緒 (${getUniqueInventoryCount()} 筆)`;
              statusEl.style.color = "var(--accent-green)";
            }
          }

      renderBrandSelect();
      renderModelSelect();
      renderTabs();
      loadCurrentView();

      document.getElementById('viewport').addEventListener('click', (e) => {
        if (!e.target.closest('.hotspot') && !e.target.closest('#hoverCard')) {
          hideHoverCard(true);
        }
      });

      document.getElementById('imageContainer').addEventListener('click', (e) => {
        if (isMobile() || !isAddingHotspotMode) return;
        if (e.target.classList.contains('hotspot') || !getCurrentView().baseImg) return;
        
        const rect = e.currentTarget.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width * 100).toFixed(2);
        const y = ((e.clientY - rect.top) / rect.height * 100).toFixed(2);
        
        const newHotspot = {
          id: 'hs_' + Date.now(),
          x: parseFloat(x),
          y: parseFloat(y),
          partNo: '',

          photos: [],

          extUrl2: '',

    }

    function deleteView(i) {
      const views = appData.brands[curBrandIdx].models[curModelIdx].views;
      if (!verifyAdminPIN(`刪除「${views[i].name}」部位視角`)) return;
      views.splice(i, 1);
      curViewIdx = Math.max(0, curViewIdx - 1);
      autoSave();
      renderTabs();
      loadCurrentView();
    }

    function loadCurrentView() {
      const v = getCurrentView();
      const img = document.getElementById('baseImage');
      const promptBox = document.getElementById('noImagePrompt');
      const toolbar = document.getElementById('canvasToolbar');
      
      if (v.baseImg) {
        img.src = v.baseImg;
        img.style.display = 'block';
        promptBox.style.display = 'none';
        if (toolbar && !isMobile()) toolbar.style.display = 'flex';
      } else {
        img.style.display = 'none';
        promptBox.style.display = 'block';
        if (toolbar) toolbar.style.display = 'none';
      }
      isAddingHotspotMode = false;
      updateAddModeUI();
      deselectHotspot();
      renderHotspots();
    }

    function uploadBaseImage(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => { 
          getCurrentView().baseImg = evt.target.result; 
          autoSave();
          loadCurrentView(); 
        };
        reader.readAsDataURL(file);
      }
      e.target.value = '';
    }

    function deleteBaseImage() {
      if (!verifyAdminPIN("刪除此張底圖")) return;
      const v = getCurrentView();
      v.baseImg = "";
      autoSave();
      loadCurrentView();
    }

    function renderHotspots() {
      document.querySelectorAll('.hotspot').forEach(el => el.remove());
      const v = getCurrentView();
      const container = document.getElementById('imageContainer');

      v.hotspots.forEach(hs => {
        const el = document.createElement('div');
        el.className = `hotspot ${hs.status || 'status-red'}`;
        el.style.left = `${hs.x}%`;
        el.style.top = `${hs.y}%`;
        
        el.addEventListener('mouseenter', (e) => {
          if (!isMobile()) {
            cancelCardHide();
            showHoverCard(hs, e);
          }
        });

        el.addEventListener('mouseleave', () => {
          if (!isMobile()) {
            scheduleCardHide();
          }
        });
        
        el.addEventListener('click', (e) => { 
          e.stopPropagation(); 
          if (!isAddingHotspotMode) {
            cancelCardHide();
            showHoverCard(hs, e);
            if (!isMobile()) {
              selectHotspot(hs);
            }
          }
        });

        container.appendChild(el);
      });
    }

    function selectHotspot(hs) {
      if (isMobile()) return;
      selectedHotspot = hs;
      const form = document.getElementById('editorForm');
      form.style.display = 'flex';
      document.getElementById('deleteHotspotBtn').style.display = 'block';
      document.getElementById('sidebarCloseBtn').style.display = 'block';
      document.getElementById('inputStatus').value = hs.status || 'status-red';
      document.getElementById('inputPartNo').value = hs.partNo || '';
      document.getElementById('inputPartName').value = hs.partName || '';
      document.getElementById('inputNotes').value = hs.notes || '';
      
      document.getElementById('inputExtUrl1').value = hs.extUrl1 || '';
      document.getElementById('inputExtUrl2').value = hs.extUrl2 || '';
      document.getElementById('inputExtUrl3').value = hs.extUrl3 || '';
      
      matchInventory();
      renderPhotoGrid();
      
      document.getElementById('inputPartName').oninput = (e) => { hs.partName = e.target.value; autoSave(); };
      document.getElementById('inputNotes').oninput = (e) => { hs.notes = e.target.value; autoSave(); };
    }

    function handleExtUrlInput(num) {
      if (!selectedHotspot) return;
      const val = document.getElementById(`inputExtUrl${num}`).value.trim();
      selectedHotspot[`extUrl${num}`] = val;
      autoSave();
    }

    function testOpenUrl(num) {
      let val = document.getElementById(`inputExtUrl${num}`).value.trim();
      if (!val) {
        alert("請先輸入網址！");
        return;
      }
      if (!val.startsWith('http://') && !val.startsWith('https://')) {
        val = 'https://' + val;
      }
      window.open(val, '_blank');
    }

    function deselectHotspot() {
      selectedHotspot = null;
      const form = document.getElementById('editorForm');
      if (form) form.style.display = 'none';
      const delBtn = document.getElementById('deleteHotspotBtn');
      if (delBtn) delBtn.style.display = 'none';
      const closeBtn = document.getElementById('sidebarCloseBtn');
      if (closeBtn) closeBtn.style.display = 'none';
    }

    function updateHotspotVisual() {
      if (selectedHotspot) {
        selectedHotspot.status = document.getElementById('inputStatus').value;
        autoSave();
        renderHotspots();
      }
    }

    function matchInventory() {
      if (!selectedHotspot) return;
      const rawInput = document.getElementById('inputPartNo').value.trim();
      selectedHotspot.partNo = rawInput;
      autoSave();

      const cleanKey = rawInput.replace(/^0+/, '');
      const match = inventoryDB[rawInput] || inventoryDB[cleanKey];

      if (match) {
        document.getElementById('dispRack').innerText = match.rack;
        document.getElementById('dispQty').innerText = `${match.qty} 個`;
        document.getElementById('dispPrice').innerText = `$${match.price}`;
        if (!document.getElementById('inputPartName').value || document.getElementById('inputPartName').value === '新零件項目') {
          document.getElementById('inputPartName').value = match.name;
          selectedHotspot.partName = match.name;
          autoSave();
        }
      } else {
        document.getElementById('dispRack').innerText = '--';
        document.getElementById('dispQty').innerText = '--';
        document.getElementById('dispPrice').innerText = '--';
      }
    }

    function uploadDetailPhotos(e) {
      const files = Array.from(e.target.files);
      files.forEach(f => {
        const r = new FileReader();
        r.onload = (evt) => {
          selectedHotspot.photos.push({
            src: evt.target.result,
            name: f.name
          });
          autoSave();
          renderPhotoGrid();
        };
        r.readAsDataURL(f);
      });
      e.target.value = '';
    }

    function triggerReplacePhoto(i) {
      replacingPhotoIndex = i;
      document.getElementById('replacePhotoInput').click();
    }

    function executePhotoReplace(e) {
      const file = e.target.files[0];
      if (file && replacingPhotoIndex >= 0 && selectedHotspot) {
        const r = new FileReader();
        r.onload = (evt) => {
          selectedHotspot.photos[replacingPhotoIndex] = {
            src: evt.target.result,
            name: file.name
          };
          autoSave();
          renderPhotoGrid();
          replacingPhotoIndex = -1;
        };
        r.readAsDataURL(file);
      }
      e.target.value = '';
    }

    function getPhotoData(p) {
      if (typeof p === 'string') {
        return { src: p, name: '未命名圖片.jpg' };
      }
      return p;
    }

    function renderPhotoGrid() {
      const grid = document.getElementById('photoGrid');
      grid.innerHTML = selectedHotspot.photos.map((p, i) => {
        const photo = getPhotoData(p);
        return `
          <div class="thumb-card">
            <div class="thumb-wrap" onclick="openLightbox(${i})">
              <img src="${photo.src}">
              <div class="thumb-btn-group">
                <button class="thumb-btn" title="原地替換這張照片" onclick="event.stopPropagation(); triggerReplacePhoto(${i})">🔄</button>
                <button class="thumb-btn del" title="刪除這張照片" onclick="event.stopPropagation(); removePhoto(${i})">✕</button>
              </div>
            </div>
            <div class="thumb-filename" title="${photo.name}">${photo.name}</div>
          </div>
        `;
      }).join('');
    }

    // --- Lightbox Functions ---
    function openLightbox(idx) {
      activePhotos = selectedHotspot ? selectedHotspot.photos : (hoverHotspot ? hoverHotspot.photos : []);
      if (!activePhotos || activePhotos.length === 0) return;
      currentPhotoIdx = idx;
      updateLightboxView();
      document.getElementById('lightboxModal').style.display = 'flex';
    }

    function openLightboxFromCard() {
      if (hoverHotspot && hoverHotspot.photos && hoverHotspot.photos.length > 0) {
        openLightbox(hoverPhotoIdx);
      }
    }

    function updateLightboxView() {
      const photo = getPhotoData(activePhotos[currentPhotoIdx]);
      document.getElementById('lightboxImg').src = photo.src;
      document.getElementById('lightboxFileName').innerText = `📄 ${photo.name}`;
      document.getElementById('lightboxCounter').innerText = `第 ${currentPhotoIdx + 1} / ${activePhotos.length} 張`;
    }

    function prevLightboxPhoto() {
      if (activePhotos.length <= 1) return;
      currentPhotoIdx = (currentPhotoIdx - 1 + activePhotos.length) % activePhotos.length;
      updateLightboxView();
    }

    function nextLightboxPhoto() {
      if (activePhotos.length <= 1) return;
      currentPhotoIdx = (currentPhotoIdx + 1) % activePhotos.length;
      updateLightboxView();
    }

    function closeLightbox() {
      document.getElementById('lightboxModal').style.display = 'none';
    }

    function removePhoto(i) {
      if (!verifyAdminPIN("刪除此張特寫照片")) return;
      selectedHotspot.photos.splice(i, 1);
      autoSave();
      renderPhotoGrid();
    }

    function deleteCurrentHotspot() {
      if (!selectedHotspot) return;
      if (!verifyAdminPIN(`刪除零件熱點「${selectedHotspot.partName || '未命名'}」`)) return;
      const v = getCurrentView();
      v.hotspots = v.hotspots.filter(h => h.id !== selectedHotspot.id);
      deselectHotspot();
      hideHoverCard(true);
      autoSave();
      renderHotspots();
    }

    function cancelCardHide() {
      if (hoverHideTimer) {
        clearTimeout(hoverHideTimer);
        hoverHideTimer = null;
      }
    }

    function scheduleCardHide() {
      cancelCardHide();
      hoverHideTimer = setTimeout(() => {
        hideHoverCard(false);
      }, 150);
    }

    function showHoverCard(hs, e) {
      cancelCardHide();
      hoverHotspot = hs;
      hoverPhotoIdx = 0;
      const card = document.getElementById('hoverCard');
      const cleanKey = (hs.partNo || '').trim().replace(/^0+/, '');
      const inv = inventoryDB[hs.partNo] || inventoryDB[cleanKey] || {};

      document.getElementById('cardPartName').innerText = hs.partName || inv.name || '未命名零件';
      document.getElementById('cardPartNo').innerText = hs.partNo || '未填寫';
      document.getElementById('cardRack').innerText = inv.rack || '--';
      document.getElementById('cardQty').innerText = inv.qty !== undefined ? `${inv.qty} 個` : '--';
      document.getElementById('cardPrice').innerText = inv.price ? `$${inv.price}` : '--';
      document.getElementById('cardNotes').innerText = hs.notes ? `技師備註: ${hs.notes}` : '暫無特別備註';

      const tag = document.getElementById('cardStockTag');
      if (inv.qty > 0) {
        tag.className = 'stock-tag';
        tag.innerText = `庫存現貨: ${inv.qty}`;
      } else {
        tag.className = 'stock-tag out';
        tag.innerText = '目前無庫存 (需叫料)';
      }

      const catBadge = document.getElementById('cardCategoryBadge');
      if (hs.status === 'status-green') {
        catBadge.className = 'category-badge badge-green';
        catBadge.innerText = '🟢 定期更換';
      } else if (hs.status === 'status-yellow') {
        catBadge.className = 'category-badge badge-yellow';
        catBadge.innerText = '🟡 預防性更換';
      } else {
        catBadge.className = 'category-badge badge-red';
        catBadge.innerText = '🔴 銷售估價';
      }

      updateCardPhotoDisplay();

      const linksGroup = document.getElementById('cardLinksGroup');
      const btn1 = document.getElementById('cardExtBtn1');
      const btn2 = document.getElementById('cardExtBtn2');
      const btn3 = document.getElementById('cardExtBtn3');
      
      let hasAnyLink = false;

      function formatUrl(u) {
        if (!u) return '';
        u = u.trim();
        return (u.startsWith('http://') || u.startsWith('https://')) ? u : 'https://' + u;
      }

      if (hs.extUrl1 && hs.extUrl1.trim()) {
        btn1.href = formatUrl(hs.extUrl1);
        btn1.style.display = 'inline-flex';
        hasAnyLink = true;
      } else { btn1.style.display = 'none'; }

      if (hs.extUrl2 && hs.extUrl2.trim()) {
        btn2.href = formatUrl(hs.extUrl2);
        btn2.style.display = 'inline-flex';
        hasAnyLink = true;
      } else { btn2.style.display = 'none'; }

      if (hs.extUrl3 && hs.extUrl3.trim()) {
        btn3.href = formatUrl(hs.extUrl3);
        btn3.style.display = 'inline-flex';
        hasAnyLink = true;
      } else { btn3.style.display = 'none'; }

      linksGroup.style.display = hasAnyLink ? 'flex' : 'none';

      if (isMobile()) {
        card.classList.add('mobile-active');
      } else {
        card.style.display = 'block';
        if (e) {
          card.style.left = `${Math.min(e.clientX + 20, window.innerWidth - 520)}px`;
          card.style.top = `${Math.min(e.clientY - 40, window.innerHeight - 560)}px`;
        }
      }
    }

    function updateCardPhotoDisplay() {
      const wrap = document.getElementById('hoverSliderWrap');
      if (hoverHotspot && hoverHotspot.photos && hoverHotspot.photos.length > 0) {
        wrap.style.display = 'block';
        const photo = getPhotoData(hoverHotspot.photos[hoverPhotoIdx]);
        document.getElementById('cardImg').src = photo.src;
        document.getElementById('cardPhotoFileName').innerText = photo.name;
        document.getElementById('cardPhotoCounter').innerText = `${hoverPhotoIdx + 1} / ${hoverHotspot.photos.length}`;
      } else {
        wrap.style.display = 'none';
      }
    }

    function prevCardPhoto(e) {
      e.stopPropagation();
      if (!hoverHotspot || hoverHotspot.photos.length <= 1) return;
      hoverPhotoIdx = (hoverPhotoIdx - 1 + hoverHotspot.photos.length) % hoverHotspot.photos.length;
      updateCardPhotoDisplay();
    }

    function nextCardPhoto(e) {
      e.stopPropagation();
      if (!hoverHotspot || hoverHotspot.photos.length <= 1) return;
      hoverPhotoIdx = (hoverPhotoIdx + 1) % hoverHotspot.photos.length;
      updateCardPhotoDisplay();
    }

    function hideHoverCard(force = false) {
      cancelCardHide();
      const card = document.getElementById('hoverCard');
      if (isMobile()) {
        if (force) card.classList.remove('mobile-active');
      } else {
        card.style.display = 'none';
      }
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = DATA_JSON_FILE;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (file) {
        const r = new FileReader();
        r.onload = async (evt) => {
          appData = JSON.parse(evt.target.result);
          await autoSave();
          curBrandIdx = 0; curModelIdx = 0; curViewIdx = 0;
          renderBrandSelect(); renderModelSelect(); renderTabs(); loadCurrentView();
        };
        r.readAsText(file);
      }
    }

    async function clearAllData() {
      if (!verifyAdminPIN("清空並重置所有車種資料與底圖")) return;
      appData = JSON.parse(JSON.stringify(defaultAppData));
      await autoSave();
      curBrandIdx = 0; curModelIdx = 0; curViewIdx = 0;
      renderBrandSelect(); renderModelSelect(); renderTabs(); loadCurrentView();
    }

    window.onload = init;
  </script>
</body>
</html>
