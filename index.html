<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>車輛檢測與零件透視系統 - Visual Inspection Hub</title>
  <!-- SheetJS 解析庫 -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg-dark: #0f141c;
      --panel-bg: rgba(22, 30, 44, 0.95);
      --border-color: #2a3b53;
      --accent-cyan: #00d2ff;
      --accent-green: #00e676;
      --accent-orange: #ff9100;
      --accent-red: #ff3d00;
      --text-main: #f0f4f8;
      --text-muted: #8a9ba8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }

    /* Header */
    header { background: #141c28; border-bottom: 1px solid var(--border-color); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; flex-wrap: wrap; gap: 8px; }
    .nav-selectors { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .btn-group { display: inline-flex; gap: 4px; align-items: center; }
    select, input, button { background: #1a2332; border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 10px; border-radius: 4px; font-size: 13px; outline: none; }
    select:focus, input:focus { border-color: var(--accent-cyan); }
    button { cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    button:hover { background: #26354a; border-color: var(--accent-cyan); }
    button.primary { background: #006699; border-color: var(--accent-cyan); }
    button.primary:hover { background: #0088cc; }
    button.danger { background: #5a1a1a; border-color: var(--accent-red); }
    button.danger:hover { background: #7a2424; }

    /* Workspace */
    .workspace { display: flex; flex: 1; height: calc(100vh - 90px); position: relative; overflow: hidden; }
    .viewport { flex: 1; position: relative; background: #080b10; overflow: auto; display: flex; align-items: center; justify-content: center; user-select: none; }
    .image-container { position: relative; display: inline-block; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
    .base-img { max-width: 100%; max-height: calc(100vh - 140px); display: block; object-fit: contain; }

    .image-container.adding-mode { cursor: crosshair !important; }
    .image-container.adding-mode .base-img { cursor: crosshair !important; }

    /* 畫布懸浮操作列 */
    .canvas-toolbar { position: absolute; top: 12px; left: 12px; display: flex; gap: 8px; z-index: 20; background: rgba(15, 23, 36, 0.9); padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border-color); backdrop-filter: blur(8px); flex-wrap: wrap; }
    .mode-btn { display: inline-flex; align-items: center; gap: 6px; font-weight: bold; padding: 6px 12px; border-radius: 4px; }
    .mode-btn.active { background: #0077aa; border-color: var(--accent-cyan); color: #fff; box-shadow: 0 0 10px rgba(0,210,255,0.5); }

    /* Hotspots */
    .hotspot { position: absolute; width: 32px; height: 32px; transform: translate(-50%, -50%); border-radius: 50%; cursor: pointer; z-index: 5; transition: transform 0.2s; touch-action: manipulation; }
    .hotspot::before { content: ''; position: absolute; width: 100%; height: 100%; border-radius: 50%; background: var(--accent-cyan); opacity: 0.85; }
    .hotspot::after { content: ''; position: absolute; top: -6px; left: -6px; width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--accent-cyan); animation: pulse 2s infinite; }
    .hotspot.status-red::before { background: var(--accent-red); }
    .hotspot.status-red::after { border-color: var(--accent-red); }
    .hotspot.status-green::before { background: var(--accent-green); }
    .hotspot.status-green::after { border-color: var(--accent-green); }
    .hotspot.status-yellow::before { background: var(--accent-orange); }
    .hotspot.status-yellow::after { border-color: var(--accent-orange); }
    .hotspot:hover { transform: translate(-50%, -50%) scale(1.25); z-index: 10; }
    @keyframes pulse { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }

    /* Sidebar Editor (電腦端在右側，手機端可切換或隱藏) */
    .sidebar { width: 440px; background: var(--panel-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 15; backdrop-filter: blur(10px); }
    .sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .sidebar-content { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: var(--text-muted); font-weight: bold; }
    
    .photo-preview-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 6px; }
    .thumb-wrap { position: relative; width: 100%; height: 110px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border-color); cursor: pointer; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .thumb-wrap .del-btn { position: absolute; top: 4px; right: 4px; background: rgba(0,0,0,0.8); color: #fff; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 2; }

    /* 外連排版 */
    .ext-link-card { background: #121924; border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .ext-link-card .ext-label { font-size: 12px; color: #a0b3c6; font-weight: bold; }
    .ext-link-row { display: flex; gap: 6px; }
    .ext-link-row input { flex: 1; }
    .ext-test-btn { background: #1e2c3f; border: 1px solid var(--accent-cyan); color: var(--accent-cyan); padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }

    /* Hover Inspection Card (電腦端為懸浮窗，手機端轉為底部抽屜 Bottom Sheet) */
    .hover-card { position: absolute; background: rgba(13, 20, 32, 0.98); border: 1.5px solid var(--accent-cyan); border-radius: 12px; padding: 16px; width: 480px; pointer-events: auto; z-index: 50; display: none; backdrop-filter: blur(14px); box-shadow: 0 20px 45px rgba(0,0,0,0.8); }
    .hover-slider-wrap { position: relative; width: 100%; height: 280px; border-radius: 8px; overflow: hidden; margin-bottom: 12px; border: 1px solid var(--border-color); background: #000; }
    .hover-slider-wrap img { width: 100%; height: 100%; object-fit: contain; }
    .slider-nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.65); color: #fff; border: none; font-size: 18px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 3; }
    .slider-nav-btn.prev { left: 8px; }
    .slider-nav-btn.next { right: 8px; }
    .slider-counter { position: absolute; bottom: 8px; right: 10px; background: rgba(0,0,0,0.7); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; z-index: 3; }

    .hover-card .stock-tag { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #004d40; color: #a7ffeb; margin-bottom: 8px; }
    .hover-card .stock-tag.out { background: #5a1a1a; color: #ff8a80; }
    .hover-card .category-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-left: 6px; margin-bottom: 8px; }
    .category-badge.badge-red { background: rgba(255, 61, 0, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
    .category-badge.badge-green { background: rgba(0, 230, 118, 0.2); color: var(--accent-green); border: 1px solid var(--accent-green); }
    .category-badge.badge-yellow { background: rgba(255, 145, 0, 0.2); color: var(--accent-orange); border: 1px solid var(--accent-orange); }

    .hover-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
    .hover-row .label { color: var(--text-muted); }

    .card-links-group { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); flex-wrap: wrap; }
    .card-ext-btn { display: inline-flex; align-items: center; gap: 4px; background: #162438; border: 1px solid var(--accent-cyan); color: var(--accent-cyan); text-decoration: none; padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .card-close-btn { display: none; position: absolute; top: 10px; right: 12px; font-size: 20px; color: #fff; background: transparent; border: none; }

    /* Tabs */
    .view-tabs { display: flex; gap: 6px; padding: 8px 16px; background: #0c1017; border-bottom: 1px solid var(--border-color); align-items: center; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
    .tab { padding: 6px 14px; border-radius: 4px; background: #141c28; border: 1px solid var(--border-color); font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .tab.active { background: #004466; border-color: var(--accent-cyan); color: #fff; font-weight: bold; }
    .tab-del-btn { color: #ff8a80; cursor: pointer; font-size: 12px; border-radius: 50%; padding: 0 4px; }

    /* Lightbox Modal */
    .lightbox-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.95); z-index: 999; justify-content: center; align-items: center; }
    .lightbox-modal img { max-width: 96vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 0 45px rgba(0,210,255,0.4); object-fit: contain; }
    .lightbox-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(20,30,45,0.85); color: #fff; border: 1px solid var(--border-color); font-size: 24px; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .lightbox-btn.prev { left: 16px; }
    .lightbox-btn.next { right: 16px; }
    .lightbox-close { position: absolute; top: 16px; right: 20px; font-size: 30px; color: #fff; cursor: pointer; background: transparent; border: none; z-index: 1000; }
    .lightbox-counter { position: absolute; bottom: 20px; font-size: 13px; background: rgba(0,0,0,0.7); color: #00d2ff; padding: 4px 12px; border-radius: 20px; }

    /* ========================================================
       📱 手機與平板專屬 RWD 響應式優化 (螢幕小於 768px 時自動觸發)
       ======================================================== */
    @media (max-width: 768px) {
      header { padding: 6px 10px; font-size: 12px; }
      .nav-selectors select, .nav-selectors button { font-size: 12px; padding: 4px 8px; }
      .workspace { flex-direction: column; }
      
      /* 手機端側邊編輯欄預設折疊或浮動 */
      .sidebar { position: fixed; bottom: 0; left: 0; width: 100%; height: 75vh; border-radius: 16px 16px 0 0; border-top: 2px solid var(--accent-cyan); box-shadow: 0 -10px 30px rgba(0,0,0,0.8); transform: translateY(100%); transition: transform 0.3s ease-out; }
      .sidebar.mobile-open { transform: translateY(0); }
      
      /* 手機端檢測卡片改為底部滑出抽屜 (Bottom Sheet) */
      .hover-card { position: fixed; bottom: 0; left: 0; width: 100% !important; max-height: 80vh; overflow-y: auto; border-radius: 16px 16px 0 0; border-top: 2px solid var(--accent-cyan); border-left: none; border-right: none; transform: none !important; top: auto !important; }
      .card-close-btn { display: block; }
      .hover-slider-wrap { height: 220px; }
      
      .canvas-toolbar { top: 8px; left: 8px; padding: 4px 8px; }
      .mode-btn { font-size: 12px; padding: 4px 8px; }
      .base-img { max-height: calc(100vh - 180px); }
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-selectors">
      <!-- 廠牌 -->
      <label>廠牌:</label>
      <select id="brandSelect" onchange="switchBrand()"></select>
      <div class="btn-group">
        <button onclick="renameBrand()" title="修改當前廠牌名稱">✏️ 改名</button>
        <button onclick="addBrand()" title="新增廠牌">➕ 廠牌</button>
        <button class="danger" onclick="deleteBrand()" title="刪除當前廠牌">🗑️</button>
      </div>
      
      <!-- 車型 -->
      <label style="margin-left: 4px;">車型:</label>
      <select id="modelSelect" onchange="switchModel()"></select>
      <div class="btn-group">
        <button onclick="renameModel()" title="修改當前車型名稱">✏️ 改名</button>
        <button onclick="addModel()" title="新增車型">➕ 車型</button>
        <button class="danger" onclick="deleteModel()" title="刪除當前車型">🗑️</button>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:6px;">
      <span id="syncStatus" style="font-size: 12px; color: var(--accent-cyan); font-weight:bold;">● 讀取記憶庫中...</span>
      <button class="primary" onclick="document.getElementById('inventoryFileInput').click()">📂 載入庫存表</button>
      <input type="file" id="inventoryFileInput" accept=".xlsx, .xls, .csv" style="display:none" onchange="loadLocalInventoryFile(event)">
      <button onclick="exportData()">💾 匯出</button>
      <button onclick="document.getElementById('importFile').click()">📂 匯入</button>
      <input type="file" id="importFile" style="display:none" onchange="importData(event)">
      <button class="danger" onclick="clearAllData()" style="font-size:12px;">🗑️ 重置</button>
    </div>
  </header>

  <div class="view-tabs" id="viewTabsContainer"></div>

  <div class="workspace">
    <div class="viewport" id="viewport">
      
      <div class="canvas-toolbar" id="canvasToolbar" style="display:none;">
        <button id="addHotspotModeBtn" class="mode-btn" onclick="toggleAddHotspotMode()">📍 新增熱點標記 (點擊啟用)</button>
        <button onclick="document.getElementById('baseImgInput').click()">🔄 更換底圖</button>
        <button class="danger" onclick="deleteBaseImage()">🗑️ 刪除底圖</button>
      </div>

      <div class="image-container" id="imageContainer">
        <img id="baseImage" class="base-img" src="" alt="請上傳底圖" style="display:none;">
        <div id="noImagePrompt" style="padding: 40px; border: 2px dashed var(--border-color); text-align: center; border-radius: 8px;">
          <p style="margin-bottom: 12px; color: var(--text-muted); font-size: 14px;">尚未上傳此部位底圖</p>
          <button class="primary" onclick="document.getElementById('baseImgInput').click()">上傳部位底圖</button>
        </div>
      </div>
      <input type="file" id="baseImgInput" accept="image/*" style="display:none" onchange="uploadBaseImage(event)">
    </div>

    <!-- Hover Card (電腦端為浮動卡片，手機端為底部抽屜) -->
    <div class="hover-card" id="hoverCard">
      <button class="card-close-btn" onclick="hideHoverCard()">✕</button>
      <div class="hover-slider-wrap" id="hoverSliderWrap" style="display:none;">
        <img id="cardImg" src="">
        <button class="slider-nav-btn prev" onclick="prevCardPhoto(event)">◀</button>
        <button class="slider-nav-btn next" onclick="nextCardPhoto(event)">▶</button>
        <div class="slider-counter" id="cardPhotoCounter">1 / 1</div>
      </div>
      <div>
        <div id="cardStockTag" class="stock-tag">庫存充足</div>
        <div id="cardCategoryBadge" class="category-badge badge-red">銷售估價</div>
      </div>
      <h3 id="cardPartName" style="margin-bottom: 6px; color: var(--accent-cyan); font-size: 18px;">零件名稱</h3>
      <div class="hover-row"><span class="label">零件料號:</span><span id="cardPartNo" style="font-family: monospace; font-size:15px; font-weight:bold;">--</span></div>
      <div class="hover-row"><span class="label">層架儲位:</span><span id="cardRack" style="color:#ffd54f; font-weight:bold; font-size:15px;">--</span></div>
      <div class="hover-row"><span class="label">在庫數量:</span><span id="cardQty" style="font-weight:bold; font-size:15px;">--</span></div>
      <div class="hover-row"><span class="label">建議售價:</span><span id="cardPrice" style="color:#81c784; font-weight:bold; font-size:15px;">--</span></div>
      <p id="cardNotes" style="font-size: 13px; color: var(--text-muted); margin-top: 10px; border-top: 1px solid var(--border-color); padding-top: 8px; line-height: 1.4;"></p>
      
      <div class="card-links-group" id="cardLinksGroup" style="display:none;">
        <a id="cardExtBtn1" class="card-ext-btn" target="_blank" style="display:none;">🎥 診斷/拆裝影片</a>
        <a id="cardExtBtn2" class="card-ext-btn" target="_blank" style="display:none;">📄 手冊/電路圖 PDF</a>
        <a id="cardExtBtn3" class="card-ext-btn" target="_blank" style="display:none;">🌐 零件規格資訊</a>
      </div>
    </div>

    <!-- Sidebar Detail Editor -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span id="editorTitle">零件熱點編輯</span>
        <div style="display:flex; gap:6px;">
          <button class="danger" id="deleteHotspotBtn" onclick="deleteCurrentHotspot()" style="display:none;">刪除熱點</button>
          <button onclick="deselectHotspot()" style="display:none;" id="sidebarCloseBtn">✕ 關閉</button>
        </div>
      </div>
      <div class="sidebar-content" id="editorForm" style="display:none;">
        <div class="form-group">
          <label>維修與銷售屬性</label>
          <select id="inputStatus" onchange="updateHotspotVisual()">
            <option value="status-red">🔴 銷售估價 (損壞更換 / 主動報價)</option>
            <option value="status-green">🟢 定期更換 (例行保養 / 固定更換)</option>
            <option value="status-yellow">🟡 預防性更換 (老化預警 / 提早更換)</option>
          </select>
        </div>
        <div class="form-group">
          <label>綁定零件代號 (輸入即自動比對)</label>
          <input type="text" id="inputPartNo" placeholder="如: 1611909180" oninput="matchInventory()" style="font-family:monospace; font-size:15px; font-weight:bold;">
        </div>
        <div class="form-group">
          <label>零件名稱 (自動抓取 / 可自訂)</label>
          <input type="text" id="inputPartName" placeholder="如: 雨刷清潔液（1Ｌ）">
        </div>
        <div class="form-group">
          <label>即時庫存資訊</label>
          <div style="background:#101722; padding:10px; border-radius:6px; font-size:13px; border:1px solid var(--border-color); display:flex; flex-direction:column; gap:6px;">
            <div style="display:flex; justify-content:space-between;"><span>層架儲位:</span><b id="dispRack" style="color:#ffd54f; font-size:15px;">--</b></div>
            <div style="display:flex; justify-content:space-between;"><span>目前在庫:</span><b id="dispQty" style="font-size:15px;">--</b></div>
            <div style="display:flex; justify-content:space-between;"><span>建議訂價:</span><b id="dispPrice" style="color:#81c784; font-size:15px;">--</b></div>
          </div>
        </div>
        <div class="form-group">
          <label>技師檢測備註</label>
          <textarea id="inputNotes" rows="3" style="background:#1a2332; border:1px solid var(--border-color); color:#fff; border-radius:4px; padding:8px; font-size:13px;"></textarea>
        </div>
        <div class="form-group">
          <label>特寫細節照片 (點擊任一張可全螢幕切換瀏覽)</label>
          <button onclick="document.getElementById('photoInput').click()">➕ 新增特寫照片</button>
          <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="uploadDetailPhotos(event)">
          <div class="photo-preview-grid" id="photoGrid"></div>
        </div>

        <div class="form-group" style="border-top: 1px solid var(--border-color); padding-top: 10px; display: flex; flex-direction: column; gap: 8px;">
          <label style="color: var(--accent-cyan); font-size: 12px;">🔗 延伸多媒體與技術外連 (選填)</label>
          
          <div class="ext-link-card">
            <span class="ext-label">1. 🎥 診斷 / 拆裝影片網址</span>
            <div class="ext-link-row">
              <input type="text" id="inputExtUrl1" placeholder="https://..." oninput="handleExtUrlInput(1)">
              <button class="ext-test-btn" onclick="testOpenUrl(1)">開啟</button>
            </div>
          </div>

          <div class="ext-link-card">
            <span class="ext-label">2. 📄 維修手冊 / 電路圖 PDF 網址</span>
            <div class="ext-link-row">
              <input type="text" id="inputExtUrl2" placeholder="https://..." oninput="handleExtUrlInput(2)">
              <button class="ext-test-btn" onclick="testOpenUrl(2)">開啟</button>
            </div>
          </div>

          <div class="ext-link-card">
            <span class="ext-label">3. 🌐 零件規格 / 外部連結網址</span>
            <div class="ext-link-row">
              <input type="text" id="inputExtUrl3" placeholder="https://..." oninput="handleExtUrlInput(3)">
              <button class="ext-test-btn" onclick="testOpenUrl(3)">開啟</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Lightbox Modal -->
  <div class="lightbox-modal" id="lightboxModal">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <button class="lightbox-btn prev" onclick="prevLightboxPhoto()">◀</button>
    <img id="lightboxImg" src="">
    <button class="lightbox-btn next" onclick="nextLightboxPhoto()">▶</button>
    <div class="lightbox-counter" id="lightboxCounter">第 1 / 1 張</div>
  </div>

  <script>
    const ADMIN_PIN = "0000";

    function verifyAdminPIN(actionName) {
      const input = prompt(`【管理員安全驗證】\n請輸入 4 位數密碼以執行「${actionName}」:`);
      if (input === null) return false;
      if (input === ADMIN_PIN) {

    const DB_NAME = "AutoInspectionDB_v2";
    const DB_VERSION = 1;
    let db;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains('store')) d.createObjectStore('store');
        };
        req.onsuccess = () => { db = req.result; resolve(db); };
        req.onerror = () => reject(req.error);
      });
    }

    function dbSet(key, val) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('store', 'readwrite');
        tx.objectStore('store').put(val, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function dbGet(key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('store', 'readonly');
        const req = tx.objectStore('store').get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function loadLocalInventoryFile(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      const statusEl = document.getElementById('syncStatus');
      statusEl.innerText = `● 正在解析 ${file.name}...`;

      reader.onload = async function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          let headerRow = 17;
          for (let i = 0; i < Math.min(25, rows.length); i++) {
            if (rows[i] && rows[i].some(col => String(col).includes('零件代號'))) {
              headerRow = i;
              break;
            }
          }

          inventoryDB = {};
          for (let i = headerRow + 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 7) continue;

            const rawPartNo = String(row[3] || '').trim();
            if (!rawPartNo) continue;

            const item = {
              rawPartNo: rawPartNo,
              name: String(row[4] || '').trim(),
              spec: String(row[5] || '').trim(),
              rack: String(row[6] || '').trim() || '未設定',
              qty: parseInt(row[9]) || 0,
              price: String(row[22] || '0').trim()
            };

            const cleanKey = rawPartNo.replace(/^0+/, '');
            inventoryDB[rawPartNo] = item;
            inventoryDB[cleanKey] = item;
          }

          await dbSet('inventory_db', inventoryDB);

          const count = getUniqueInventoryCount();
          statusEl.innerText = `● 庫存已永久記憶 (${count} 筆)`;
          statusEl.style.color = "var(--accent-green)";

          if (selectedHotspot) matchInventory();
        } catch (err) {
          statusEl.innerText = `▲ 解析失敗，請確認格式`;
          statusEl.style.color = "var(--accent-red)";
        }
      };
      reader.readAsArrayBuffer(file);
    }

      if (match) {
        document.getElementById('dispRack').innerText = match.rack;
        document.getElementById('dispQty').innerText = `${match.qty} 個`;
        document.getElementById('dispPrice').innerText = `$${match.price}`;

          document.getElementById('inputPartName').value = match.name;
          selectedHotspot.partName = match.name;
          autoSave();

      currentPhotoIdx = idx;

    function prevLightboxPhoto() {
      if (activePhotos.length <= 1) return;
      currentPhotoIdx = (currentPhotoIdx - 1 + activePhotos.length) % activePhotos.length;
      updateLightboxView();

    function nextLightboxPhoto() {
      if (activePhotos.length <= 1) return;
      currentPhotoIdx = (currentPhotoIdx + 1) % activePhotos.length;

    // --- Hover Card Functions ---
    function showHoverCard(hs, e) {
      hoverHotspot = hs;
      hoverPhotoIdx = 0;
      const card = document.getElementById('hoverCard');
      const cleanKey = (hs.partNo || '').trim().replace(/^0+/, '');
      const inv = inventoryDB[hs.partNo] || inventoryDB[cleanKey] || {};

      document.getElementById('cardPartName').innerText = hs.partName || inv.name || '未命名零件';
      document.getElementById('cardPartNo').innerText = hs.partNo || '未填寫';
      document.getElementById('cardRack').innerText = inv.rack || '--';
      document.getElementById('cardQty').innerText = inv.qty !== undefined ? `${inv.qty} 個` : '--';
      document.getElementById('cardPrice').innerText = inv.price ? `$${inv.price}` : '--';
      document.getElementById('cardNotes').innerText = hs.notes ? `技師備註: ${hs.notes}` : '暫無特別備註';

      const tag = document.getElementById('cardStockTag');
      if (inv.qty > 0) {
        tag.className = 'stock-tag';
        tag.innerText = `庫存現貨: ${inv.qty}`;
      } else {
        tag.className = 'stock-tag out';
        tag.innerText = '目前無庫存 (需叫料)';
      }

      const catBadge = document.getElementById('cardCategoryBadge');
      if (hs.status === 'status-green') {
        catBadge.className = 'category-badge badge-green';
        catBadge.innerText = '🟢 定期更換';
      } else if (hs.status === 'status-yellow') {
        catBadge.className = 'category-badge badge-yellow';
        catBadge.innerText = '🟡 預防性更換';
      } else {
        catBadge.className = 'category-badge badge-red';
        catBadge.innerText = '🔴 銷售估價';
      }

      updateCardPhotoDisplay();

      const linksGroup = document.getElementById('cardLinksGroup');
      const btn1 = document.getElementById('cardExtBtn1');
      const btn2 = document.getElementById('cardExtBtn2');
      const btn3 = document.getElementById('cardExtBtn3');
      
      let hasAnyLink = false;

      function formatUrl(u) {
        if (!u) return '';
        u = u.trim();
        return (u.startsWith('http://') || u.startsWith('https://')) ? u : 'https://' + u;
      }

      if (hs.extUrl1 && hs.extUrl1.trim()) {
        btn1.href = formatUrl(hs.extUrl1);
        btn1.style.display = 'inline-flex';
        hasAnyLink = true;
      } else { btn1.style.display = 'none'; }

      if (hs.extUrl2 && hs.extUrl2.trim()) {
        btn2.href = formatUrl(hs.extUrl2);
        btn2.style.display = 'inline-flex';
        hasAnyLink = true;
      } else { btn2.style.display = 'none'; }

      if (hs.extUrl3 && hs.extUrl3.trim()) {
        btn3.href = formatUrl(hs.extUrl3);
        btn3.style.display = 'inline-flex';
        hasAnyLink = true;
      } else { btn3.style.display = 'none'; }

      linksGroup.style.display = hasAnyLink ? 'flex' : 'none';

      card.style.display = 'block';

      if (window.innerWidth > 768 && e) {
        card.style.left = `${Math.min(e.clientX + 20, window.innerWidth - 520)}px`;
        card.style.top = `${Math.min(e.clientY - 40, window.innerHeight - 560)}px`;
      }
    }

    function updateCardPhotoDisplay() {
      const wrap = document.getElementById('hoverSliderWrap');
      if (hoverHotspot && hoverHotspot.photos && hoverHotspot.photos.length > 0) {
        wrap.style.display = 'block';
        document.getElementById('cardImg').src = hoverHotspot.photos[hoverPhotoIdx];
        document.getElementById('cardPhotoCounter').innerText = `${hoverPhotoIdx + 1} / ${hoverHotspot.photos.length}`;
      } else {
        wrap.style.display = 'none';
      }
    }

    function prevCardPhoto(e) {
      e.stopPropagation();
      if (!hoverHotspot || hoverHotspot.photos.length <= 1) return;
      hoverPhotoIdx = (hoverPhotoIdx - 1 + hoverHotspot.photos.length) % hoverHotspot.photos.length;
      updateCardPhotoDisplay();
    }

    function nextCardPhoto(e) {
      e.stopPropagation();
      if (!hoverHotspot || hoverHotspot.photos.length <= 1) return;
      hoverPhotoIdx = (hoverPhotoIdx + 1) % hoverHotspot.photos.length;
      updateCardPhotoDisplay();
    }

    function hideHoverCard() {
      document.getElementById('hoverCard').style.display = 'none';
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `parts_inspection_backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (file) {
        const r = new FileReader();
        r.onload = async (evt) => {
          appData = JSON.parse(evt.target.result);
          await autoSave();
          curBrandIdx = 0; curModelIdx = 0; curViewIdx = 0;
          renderBrandSelect(); renderModelSelect(); renderTabs(); loadCurrentView();
        };
        r.readAsText(file);
      }
    }

    async function clearAllData() {
      if (!verifyAdminPIN("清空並重置所有車種資料與底圖")) return;
      appData = JSON.parse(JSON.stringify(defaultAppData));
      await autoSave();
      curBrandIdx = 0; curModelIdx = 0; curViewIdx = 0;
      renderBrandSelect(); renderModelSelect(); renderTabs(); loadCurrentView();
    }

    window.onload = init;
  </script>
</body>
</html>
